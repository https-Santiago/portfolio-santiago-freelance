<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada | Santiago Ferlatti</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e1e;
      color: #e5e5e5;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image:
        linear-gradient(#e5e5e5 1px, transparent 1px),
        linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .container { position: relative; z-index: 10; padding: 2rem; }
    .code {
      font-weight: 700;
      font-size: clamp(5rem, 20vw, 10rem);
      line-height: 1;
      color: #a78bfa;
      margin-bottom: 1rem;
    }
    .title {
      font-weight: 600;
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: #ffffff;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .desc {
      color: rgba(255,255,255,0.4);
      font-size: 0.95rem;
      max-width: 360px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #7c3aed;
      color: white;
      font-weight: 500;
      padding: 0.9rem 2.2rem;
      border: 1px solid #a78bfa;
      border-radius: 0.4rem;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn:hover { background: #6d28d9; }
    .clip {
      width: 200px;
      height: 26px;
      margin: 0 auto 2rem;
      border-radius: 4px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      position: relative;
      overflow: hidden;
    }
    .clip::before {
      content: 'sin_señal.mp4';
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="container">
    <div class="clip"></div>
    <div class="code">404</div>
    <p class="title">Página no encontrada</p>
    <p class="desc">Este clip no existe en la línea de tiempo. Volvé al inicio.</p>
    <a href="/" class="btn">Volver al inicio</a>
  </div>
</body>
</html>
