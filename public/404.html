<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada | Artemis Agency</title>
  <meta name="robots" content="noindex" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Space+Grotesk:wght@400;500&display=swap');
    body {
      background: #02050d;
      color: #e8f0ff;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.7; }
    }
    .container {
      position: relative;
      z-index: 10;
      padding: 2rem;
    }
    .code {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(5rem, 20vw, 10rem);
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 20%, #7eb8ff 60%, #ff6b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1rem, 3vw, 1.6rem);
      color: white;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .desc {
      color: rgba(255,255,255,0.4);
      font-size: 1rem;
      max-width: 360px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #ff6b00;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      padding: 0.9rem 2.2rem;
      border-radius: 0.6rem;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn:hover { background: #ff9d4d; }
    .orbit {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(255,107,0,0.15);
      margin: 0 auto 2rem;
      position: relative;
      animation: spin 20s linear infinite;
    }
    .orbit::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #ff6b00;
      border-radius: 50%;
      transform: translateX(-50%);
      opacity: 0.7;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <div class="container">
    <div class="orbit"></div>
    <div class="code">404</div>
    <p class="title">Página no encontrada</p>
    <p class="desc">Parece que esta ruta se perdió en el espacio. Volvé a la base de control.</p>
    <a href="/" class="btn">Volver al inicio</a>
  </div>

  <script>
    const container = document.getElementById('stars')
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div')
      s.className = 'star'
      const size = Math.random() * 2 + 1
      s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s`
      container.appendChild(s)
    }
  </script>
</body>
</html>
