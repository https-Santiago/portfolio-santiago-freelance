  <circle cx="256" cy="282" r="74" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="282" r="40" fill="#ffffff"/>
  <circle cx="256" cy="282" r="40" fill="url(#bg)" opacity="0.0"/>
  <circle cx="256" cy="282" r="20" fill="url(#bg)"/>
  <!-- Brillo del lente -->
  <circle cx="240" cy="266" r="9" fill="#ffffff" opacity="0.85"/>

  <!-- Luz REC -->
  <circle cx="372" cy="212" r="9" fill="#7c3aed"/>
